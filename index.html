<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>AGREST</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="AGREST - Estatística Experimental para Ciências Agrárias">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: painel de controles à esquerda (como o design B no Windows), resultados à direita; uma coluna no celular */
:root {
  --bg: #f3f5f1;
  --painel: #ffffff;
  --fg: #1d241c;
  --suave: #5d6a5a;
  --linha: #d5dccf;
  --acento: #2f6b3a;
  --acento-fg: #ffffff;
  --acento-claro: #e3eee1;
  --res-bg: #fbfcfa;
  --erro: #a3321f;
  --erro-bg: #fbe9e5;
  --f-texto: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141814; --painel: #1c211b; --fg: #e3e8df; --suave: #9aa695; --linha: #333b31;
    --acento: #7fbf86; --acento-fg: #0f1a10; --acento-claro: #263526; --res-bg: #181c17;
    --erro: #f0937f; --erro-bg: #3a201b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141814; --painel: #1c211b; --fg: #e3e8df; --suave: #9aa695; --linha: #333b31;
  --acento: #7fbf86; --acento-fg: #0f1a10; --acento-claro: #263526; --res-bg: #181c17;
  --erro: #f0937f; --erro-bg: #3a201b; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-texto); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
}
.app { display: grid; grid-template-columns: 350px minmax(0, 1fr); gap: 16px; height: 100%; max-width: 1400px; margin: 0 auto; }
.painel {
  background: var(--painel); border: 1px solid var(--linha); border-radius: 6px;
  padding: 14px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; min-height: 0;
}
.marca { display: flex; align-items: baseline; gap: 8px; }
.marca h1 { font-size: 20px; font-weight: 600; letter-spacing: 0.06em; margin: 0; color: var(--acento); }
.marca span { font-size: 12px; color: var(--suave); }
.linha-arquivo { display: flex; gap: 8px; }
.nome-arquivo {
  flex: 1; min-width: 0; border: 1px solid var(--linha); border-radius: 4px; padding: 6px 8px;
  font-size: 13px; color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
fieldset { border: 1px solid var(--linha); border-radius: 4px; margin: 0; padding: 6px 10px 10px; }
legend { font-size: 12px; font-weight: 600; color: var(--suave); text-transform: uppercase; letter-spacing: 0.06em; padding: 0 4px; }
.opcoes { display: grid; grid-template-columns: 0.8fr 1.2fr; gap: 4px 10px; }
.opcoes.tres { grid-template-columns: repeat(3, 1fr); }
.opcoes.solta { display: flex; flex-wrap: wrap; gap: 4px 16px; }
label.op { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
label.op.desab { color: var(--suave); opacity: 0.6; cursor: default; }
.sig { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 13px; }
.rotulo { font-size: 12px; font-weight: 600; color: var(--suave); text-transform: uppercase; letter-spacing: 0.06em; }
.colunas {
  list-style: none; margin: 4px 0 0; padding: 4px 0; border: 1px solid var(--linha); border-radius: 4px;
  min-height: 70px; max-height: 160px; overflow-y: auto; user-select: none;
}
.colunas li { padding: 3px 10px; font-size: 13px; cursor: default; touch-action: manipulation; }
@media (pointer: coarse) { .colunas li { padding: 9px 12px; font-size: 15px; cursor: pointer; } }
.colunas li:hover { background: var(--acento-claro); }
.colunas .vazio { color: var(--suave); font-style: italic; }
.dica { font-size: 11px; color: var(--suave); margin-top: 3px; }
.papeis { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 6px 8px; align-items: center; }
.papeis label { font-size: 13px; }
select, button { font: inherit; font-size: 13px; }
select { width: 100%; padding: 4px 6px; border: 1px solid var(--linha); border-radius: 4px; background: var(--painel); color: var(--fg); }
button {
  border: 1px solid var(--linha); background: var(--painel); color: var(--fg); border-radius: 4px;
  padding: 6px 10px; cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--acento); }
button:disabled { opacity: 0.45; cursor: default; }
button.principal { background: var(--acento); border-color: var(--acento); color: var(--acento-fg); font-weight: 600; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
.botoes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: auto; }
.resultado {
  display: flex; flex-direction: column; min-width: 0; min-height: 0;
  background: var(--res-bg); border: 1px solid var(--linha); border-radius: 6px;
}
.barra { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--linha); flex-wrap: wrap; }
.barra .titulo { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.barra button { padding: 3px 8px; font-size: 12px; }
.aviso { margin: 10px 12px 0; padding: 8px 10px; border-radius: 4px; background: var(--erro-bg); color: var(--erro); font-size: 13px; white-space: pre-wrap; }
#aviso-arquivo { margin: 0; }
.aviso.ok { background: var(--acento-claro); color: var(--acento); }
pre#saida {
  margin: 0; padding: 12px 14px; overflow: auto; flex: 1; min-height: 300px;
  font-family: var(--f-mono); font-size: 13px; line-height: 1.45; tab-size: 4;
  font-variant-numeric: tabular-nums;
}
.fundo { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.caixa { background: var(--painel); color: var(--fg); border-radius: 6px; padding: 18px; max-width: 460px; width: 100%; display: flex; flex-direction: column; gap: 12px; }
.caixa h2 { margin: 0; font-size: 16px; }
.caixa p { margin: 0; white-space: pre-wrap; line-height: 1.5; }
.caixa .acoes { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
@media (max-width: 760px) {
  html, body { height: auto; }
  .app { grid-template-columns: 1fr; height: auto; }
  pre#saida { min-height: 60vh; font-size: 11px; }
}
</style>

<div class="app">
  <form class="painel" id="painel" onsubmit="return false">
    <div class="marca"><h1>AGREST</h1><span>Estatística Experimental para Ciências Agrárias</span></div>

    <div class="linha-arquivo">
      <button type="button" id="btn-arquivo" title="Abrir arquivo (Ctrl+O)">Arquivo</button>
      <div class="nome-arquivo" id="nome-arquivo">nenhum arquivo</div>
      <input type="file" id="entrada-arquivo" accept=".xlsx,.csv,.txt,.tsv,text/plain,text/csv,text/tab-separated-values,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
    </div>
    <div class="aviso" id="aviso-arquivo" hidden></div>

    <fieldset>
      <legend>Delineamento</legend>
      <div class="opcoes">
        <label class="op"><input type="radio" name="delin" id="d-dic" value="1016" checked> DIC</label>
        <label class="op"><input type="radio" name="delin" id="d-psdic" value="1032"> Parc. Subdivididas DIC</label>
        <label class="op"><input type="radio" name="delin" id="d-dbc" value="1017"> DBC</label>
        <label class="op"><input type="radio" name="delin" id="d-psdbc" value="1033"> Parc. Subdivididas DBC</label>
        <label class="op"><input type="radio" name="delin" id="d-fat" value="1018"> Fatorial DIC</label>
        <label class="op" id="rot-forcar"><input type="checkbox" id="forcar"> Forçar Desdobramento</label>
        <label class="op"><input type="radio" name="delin" id="d-fatdbc" value="1019"> Fatorial DBC</label>
      </div>
    </fieldset>

    <div>
      <div class="rotulo">Colunas do arquivo</div>
      <ul class="colunas" id="colunas"><li class="vazio">Abra um arquivo para ver as colunas</li></ul>
      <div class="dica" id="dica-colunas">Duplo clique numa coluna preenche a próxima caixa vazia.</div>
    </div>

    <div class="papeis" id="papeis">
      <label for="c-resp" id="r-resp">Variável resposta</label><select id="c-resp" data-id="1010"></select>
      <label for="c-a" id="r-a">Tratamentos</label><select id="c-a" data-id="1008"></select>
      <label for="c-b" id="r-b">Fator B</label><select id="c-b" data-id="1014"></select>
      <label for="c-blocos" id="r-blocos">Blocos</label><select id="c-blocos" data-id="1015"></select>
    </div>

    <fieldset>
      <legend>Teste post-hoc</legend>
      <div class="opcoes solta">
        <label class="op"><input type="radio" name="teste" id="t-tukey" value="1020" checked> Tukey</label>
        <label class="op"><input type="radio" name="teste" id="t-duncan" value="1021"> Duncan</label>
        <label class="op"><input type="radio" name="teste" id="t-sk" value="1038"> Scott-Knott</label>
      </div>
      <div class="sig">Sig.
        <label class="op"><input type="radio" name="sig" id="s-10" value="1027"> 10%</label>
        <label class="op"><input type="radio" name="sig" id="s-5" value="1028" checked> 5%</label>
        <label class="op"><input type="radio" name="sig" id="s-1" value="1029"> 1%</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Transformações</legend>
      <div class="opcoes solta">
        <label class="op"><input type="radio" name="transf" id="x-nenhuma" value="1009" checked> Nenhuma</label>
        <label class="op"><input type="radio" name="transf" id="x-log" value="1011"> Logarítmica</label>
        <label class="op"><input type="radio" name="transf" id="x-raiz" value="1012"> Raiz quadrada</label>
        <label class="op"><input type="radio" name="transf" id="x-ang" value="1013"> Angular</label>
        <label class="op" id="rot-meio"><input type="checkbox" id="meio"> + 0,5</label>
      </div>
    </fieldset>

    <div class="botoes">
      <button type="button" id="btn-sobre" title="F1">Sobre</button>
      <button type="button" id="btn-salvar" title="Salvar o resultado em .txt (Ctrl+S)">Salvar</button>
      <button type="button" id="btn-word" title="Exportar as tabelas para o Word (Ctrl+E)" disabled>Word</button>
      <button type="button" id="btn-analise" class="principal" title="F5">Análise</button>
    </div>
  </form>

  <section class="resultado">
    <div class="barra">
      <span class="titulo" id="titulo-res">Resultados</span>
      <button type="button" id="btn-menor" title="Diminuir a letra">A−</button>
      <button type="button" id="btn-maior" title="Aumentar a letra">A+</button>
      <button type="button" id="btn-copiar">Copiar</button>
    </div>
    <div class="aviso" id="aviso" hidden></div>
    <pre id="saida">Carregando o AGREST…</pre>
  </section>
</div>

<div class="fundo" id="pergunta" hidden>
  <div class="caixa" role="dialog" aria-modal="true" aria-labelledby="pergunta-titulo">
    <h2 id="pergunta-titulo"></h2>
    <p id="pergunta-texto"></p>
    <div class="acoes">
      <button type="button" id="p-cancelar">Cancelar</button>
      <button type="button" id="p-nao">Porcentagem (0 a 100)</button>
      <button type="button" id="p-sim" class="principal">Proporção (0 a 1)</button>
    </div>
  </div>
</div>

  const doisFatores = ![1016, 1017].includes(marcado("delin"));
  $("forcar").disabled = !doisFatores; if (!doisFatores) $("forcar").checked = false;
  $("rot-forcar").classList.toggle("desab", !doisFatores);
  const angular = marcado("transf") === 1013;
  $("meio").disabled = angular; if (angular) $("meio").checked = false;
  $("rot-meio").classList.toggle("desab", angular);
}

function preencherColunas(nomes) {
  colunas = nomes;
  const lista = $("colunas"); lista.innerHTML = "";
  if (!nomes.length) { lista.innerHTML = '<li class="vazio">Nenhuma coluna encontrada</li>'; }
  nomes.forEach((n, i) => {
    const li = document.createElement("li"); li.textContent = n;
    /* No celular o duplo toque não é confiável (vira zoom): lá um toque só basta */
    li.addEventListener(TOQUE ? "click" : "dblclick", () => colunaParaProximaCaixa(i));
    lista.appendChild(li);
  });
  for (const id of CAIXAS) {
    const s = $(id); s.innerHTML = "";
    s.add(new Option("", "-1"));
    nomes.forEach((n, i) => s.add(new Option(n, String(i))));
    s.value = "-1";
  }
}

function colunaParaProximaCaixa(i) {
  for (const id of CAIXAS) {
    const s = $(id);
    if (!s.hidden && s.value === "-1") { s.value = String(i); return; }
  }
}

const TOQUE = window.matchMedia && matchMedia("(pointer: coarse)").matches;
const CELULAR = () => window.matchMedia && matchMedia("(max-width: 760px)").matches;
/* No celular os resultados ficam abaixo dos controles: leva a tela até eles */
function irParaResultado() {
  if (CELULAR()) document.querySelector(".resultado").scrollIntoView({ behavior: "smooth", block: "start" });
}

function mostrarAviso(texto, ok) {
  const a = $("aviso");
  a.textContent = texto || ""; a.hidden = !texto; a.classList.toggle("ok", !!ok);
}

/* Avisos do programa: "título\x1fmensagem\x1e"; os que começam com "?" são perguntas */
function lerMensagens() {
  return api.mensagens().split("\x1e").filter(Boolean).map(m => {
    const pergunta = m.startsWith("?"); if (pergunta) m = m.slice(1);
    const [titulo, texto] = m.split("\x1f");
    return { pergunta, titulo, texto };
  });
}

function abrirTexto(bytes, nome) {
  M.FS.writeFile("/dados", bytes);
  nomeArquivo = nome; $("nome-arquivo").textContent = nome; $("nome-arquivo").title = nome;
  const nomes = api.abrir("/dados", nome).split("\n").filter(s => s !== "");
  preencherColunas(nomes);
  const msgs = lerMensagens();
  /* O aviso do arquivo fica logo abaixo do botão Arquivo, onde a pessoa está olhando */
  const avisoArq = $("aviso-arquivo");
  avisoArq.textContent = msgs.map(m => m.texto).join("\n\n");
  avisoArq.hidden = !msgs.length;
  mostrarAviso("");
  $("btn-word").disabled = true;
}

/* Passa as escolhas da tela para o AGREST, na mesma ordem em que o usuário clicaria */
function passarEscolhas() {
  for (const grupo of ["delin", "teste", "sig", "transf"]) {
    document.querySelectorAll(`input[name="${grupo}"]`).forEach(r => api.desmarcar(+r.value));
    api.marcar(marcado(grupo), 1);
  }
  api.marcar(ID.CHECK1, $("meio").checked ? 1 : 0);
  api.marcar(ID.CHECK2, $("forcar").checked ? 1 : 0);
  for (const id of CAIXAS) api.escolher(+$(id).dataset.id, $(id).hidden ? -1 : +$(id).value);
}

function analisar(resposta = 0) {
  if (!M) return;
  passarEscolhas();
  const texto = api.analisar(resposta);
  const msgs = lerMensagens();
  const pergunta = msgs.find(m => m.pergunta);
  if (pergunta) { perguntar(pergunta); return; }
  mostrarAviso(msgs.map(m => m.texto).join("\n\n"));
  if (texto) {
    $("saida").textContent = texto.replace(/\r\n/g, "\n");
    $("titulo-res").textContent = "Resultados" + (nomeArquivo ? " · " + nomeArquivo : "");
    $("saida").scrollTop = 0;
  }
  irParaResultado();
  if (texto) temAnalise = true;
  $("btn-word").disabled = !texto;
}

function perguntar(p) {
  $("pergunta-titulo").textContent = p.titulo;
  $("pergunta-texto").textContent = p.texto.replace(/\n\nSim:[\s\S]*$/, "");
  $("pergunta").hidden = false; $("p-sim").focus();
}
function responder(r) { $("pergunta").hidden = true; if (r) analisar(r); }

/* Baixar arquivos (funciona ao abrir a página pelo GitHub Pages ou direto do computador) */
let salvarClaude = null;   /* na prévia dentro do Claude, os arquivos passam por uma confirmação */
if (window.claude && window.claude.use) window.claude.use("downloads").then(d => { salvarClaude = d; }).catch(() => {});
function baixar(bytes, nome, tipo) {
  if (salvarClaude) {
    salvarClaude.save({ filename: nome, data: bytes instanceof Uint8Array ? bytes.slice() : bytes })
      .catch(e => { if (e && e.code !== "declined") mostrarAviso("Não foi possível salvar o arquivo aqui (" + (e.code || e) + ")."); });
    return;
  }
  const url = URL.createObjectURL(new Blob([bytes], { type: tipo }));
  const a = document.createElement("a"); a.href = url; a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function semExtensao(n) { return (n || "").replace(/\.[^.]*$/, ""); }

function salvar() {
  const texto = $("saida").textContent;
  if (temAnalise) {
    baixar(texto.replace(/\r?\n/g, "\r\n"), (nomeArquivo ? semExtensao(nomeArquivo) : "resultado") + "_analise.txt", "text/plain;charset=utf-8");
  } else mostrarAviso("Não há análise gerada para salvar.");
}

function word() {
  const caminho = api.word();
  const msgs = lerMensagens().filter(m => !/sucesso/i.test(m.texto));
  if (!caminho) { mostrarAviso(msgs.map(m => m.texto).join("\n\n")); return; }
  const bytes = M.FS.readFile(caminho);
  baixar(bytes, caminho.split("/").pop(), "application/vnd.openxmlformats-officedocument.wordprocessingml.document");
  mostrarAviso(msgs.length ? msgs.map(m => m.texto).join("\n\n") : "Tabelas exportadas para o Word.", !msgs.length);
}

function sobre() {
  temAnalise = false; $("btn-word").disabled = true;
  $("saida").textContent = api.intro().replace(/\r\n/g, "\n");
  $("titulo-res").textContent = "Sobre o AGREST";
  mostrarAviso("");
}

function letra(passo) {
  tamanhoLetra = passo === 0 ? 13 : Math.min(28, Math.max(8, tamanhoLetra + passo));
  $("saida").style.fontSize = tamanhoLetra + "px";
}

async function copiar() {
  try { await navigator.clipboard.writeText($("saida").textContent); mostrarAviso("Resultado copiado.", true); }
  catch { const r = document.createRange(); r.selectNodeContents($("saida")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
}

/* Botões, opções e atalhos (os mesmos do programa no Windows) */
document.querySelectorAll('input[name="delin"], input[name="transf"]').forEach(r => r.addEventListener("change", atualizarPainel));
$("btn-arquivo").onclick = () => $("entrada-arquivo").click();
$("entrada-arquivo").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  abrirTexto(new Uint8Array(await f.arrayBuffer()), f.name);
  e.target.value = "";
};
$("btn-analise").onclick = () => analisar();
$("btn-salvar").onclick = salvar;
$("btn-word").onclick = word;
$("btn-sobre").onclick = sobre;
$("btn-maior").onclick = () => letra(2);
$("btn-menor").onclick = () => letra(-2);
$("btn-copiar").onclick = copiar;
$("p-sim").onclick = () => responder(ID.IDYES);
$("p-nao").onclick = () => responder(ID.IDNO);
$("p-cancelar").onclick = () => responder(0);
document.addEventListener("keydown", e => {
  if (!$("pergunta").hidden) { if (e.key === "Escape") responder(0); return; }
  const ctrl = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (e.key === "F5") { e.preventDefault(); analisar(); }
  else if (e.key === "F1") { e.preventDefault(); sobre(); }
  else if (ctrl && k === "o") { e.preventDefault(); $("btn-arquivo").click(); }
  else if (ctrl && k === "s") { e.preventDefault(); salvar(); }
  else if (ctrl && k === "e") { e.preventDefault(); if (!$("btn-word").disabled) word(); }
});

if (TOQUE) $("dica-colunas").textContent = "Toque numa coluna para preencher a próxima caixa vazia.";
atualizarPainel();
AgrestModulo().then(modulo => {
  M = modulo;
  const c = (n, r, t) => M.cwrap(n, r, t);
  api = {
    iniciar: c("web_iniciar", null, []), intro: c("web_intro", "string", []),
    marcar: c("web_marcar", null, ["number", "number"]), desmarcar: c("web_desmarcar", null, ["number"]),
    escolher: c("web_escolher", null, ["number", "number"]),
    abrir: c("web_abrir", "string", ["string", "string"]), analisar: c("web_analisar", "string", ["number"]),
    mensagens: c("web_mensagens", "string", []), word: c("web_word", "string", []),
  };
  api.iniciar();
  M.FS.mkdir("/saida");
  /* Abre no "Sobre o AGREST", como o programa no Windows */
  sobre();
}).catch(err => { $("saida").textContent = "Não foi possível carregar o AGREST neste navegador.\n\n" + err; });
</script>

</body>
</html>
